allowBuilds:
  # Its postinstall re-downloads libpowersync{,-async}.wasm from GitHub, and the
  # published tarball already contains both. Skipping it keeps installs offline.
  '@journeyapps/wa-sqlite': false
  '@openrouter/sdk': false
  esbuild: true
  lightningcss: true
minimumReleaseAgeExclude:
  - '@tanstack/ai@0.43.1'
  - '@tanstack/ai-client@0.23.1'
  - '@tanstack/ai-react@0.19.1'
